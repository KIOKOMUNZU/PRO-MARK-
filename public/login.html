<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRO-MARK Login</title><link rel="stylesheet" href="/css/app.css"><style>.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:18px}.login-brand img{width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(23,54,93,.16))}.login-brand-name{font-weight:900;font-size:1.65rem;letter-spacing:.14em;color:#17365D}.login-brand-sub{font-size:.75rem;font-weight:800;letter-spacing:.16em;color:#6b7280}</style></head><body><main class="auth card"><div class="login-brand"><img src="/assets/pro-mark-logo.svg" alt="PRO-MARK logo"><div><div class="login-brand-name">PRO-MARK</div><div class="login-brand-sub">SCHOOL MANAGEMENT PORTAL</div></div></div><h1>Sign in</h1><p class="muted">Email login — no phone number required.</p><form id="loginForm"><label>Email<input id="email" name="email" type="email" required autocomplete="username"></label><label>Password<input id="password" name="password" type="password" required autocomplete="current-password"></label><label id="roleWrap" hidden>Role<select id="role" name="role"><option value="">Select role</option></select></label><button class="btn" id="loginButton" type="submit">Sign in</button><p id="message"></p></form></main><script>
(function(){'use strict';const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),role=document.getElementById('role'),roleWrap=document.getElementById('roleWrap'),message=document.getElementById('message'),button=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Signing in…';button.disabled=true;try{const body={email:email.value.trim(),password:password.value};if(role.value){const [selectedRole,selectedSchoolId]=role.value.split('::');body.role=selectedRole;if(selectedSchoolId)body.school_id=selectedSchoolId;}const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(r.status===409&&Array.isArray(d.roles)){role.innerHTML='<option value="">Select role</option>';d.roles.forEach(x=>{const o=document.createElement('option');o.value=x.role+'::'+(x.school_id||'');o.textContent=x.role+(x.school_name?' · '+x.school_name:'');role.appendChild(o)});roleWrap.hidden=false;message.textContent='This email has multiple roles. Select the role you want and sign in again.';return;}if(!r.ok)throw new Error(d.error||'Login failed');localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));location.href=d.user.role==='PLATFORM_OWNER'?'/owner.html':'/dashboard.html';}catch(x){message.textContent=x.message;}finally{button.disabled=false;}});})();
</script></body></html>
